name: update-feeds
on:
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - run: go build -o tgfeed ./cmd/tgfeed
      - run: ./tgfeed --config config.yaml
        env:
          TRANSLATE_API_KEY: ${{ secrets.TRANSLATE_API_KEY }}
          TRANSLATE_API_BASE_URL: ${{ secrets.TRANSLATE_API_BASE_URL }}
          TRANSLATE_API_MODEL: ${{ secrets.TRANSLATE_API_MODEL }}
      - name: commit state and feeds
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add state.db public/feeds
          git diff --staged --quiet || git commit -m "update feeds $(date -u +%FT%TZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
